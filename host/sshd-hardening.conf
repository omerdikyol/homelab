# SSH: keys only, no root login. Installed as
# /etc/ssh/sshd_config.d/10-home-server.conf, which sorts before
# 50-cloud-init.conf; sshd keeps the first value it reads. Every login from
# 2026-09-01 to 09-15 used a key (2,027 of 2,027), and root has no keys.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
