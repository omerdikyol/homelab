# zram is the first swap device, so pushing idle anonymous memory out costs a
# little CPU instead of evicting page cache that must be re-read from the SMR
# disk. 100 weighs the two equally; values above that would keep pushing to
# /swap.img on the HDD once zram fills (Pop!_OS uses 180 with zram only).
# page-cluster 0: no swap readahead, which only pays off on rotating swap.
#
vm.swappiness = 100
vm.page-cluster = 0
