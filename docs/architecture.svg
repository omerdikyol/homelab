<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" role="img" aria-label="Architecture: public traffic through Cloudflare Tunnel and Access, private traffic over Tailscale, apps on one host, three backup repositories, and alerts to a phone">
  <style>
    :root { --bg:#ffffff; --box:#f3f4f6; --line:#6b7280; --text:#111827; --accent:#2563eb; --warn:#b45309; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --box:#161b22; --line:#8b949e; --text:#e6edf3; --accent:#58a6ff; --warn:#d29922; } }
    .bg{fill:var(--bg)} .box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
    .acc{fill:none;stroke:var(--accent);stroke-width:1.6} .t{fill:var(--text);font:14px system-ui,sans-serif}
    .s{fill:var(--line);font:12px system-ui,sans-serif} .h{fill:var(--text);font:600 14px system-ui,sans-serif}
    .ln{stroke:var(--line);stroke-width:1.4;fill:none;marker-end:url(#a)} .ac{stroke:var(--accent);stroke-width:1.6;fill:none;marker-end:url(#b)}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
  </defs>
  <rect class="bg" width="860" height="440"/>

  <rect class="box" x="20" y="30" width="170" height="64" rx="8"/><text class="h" x="36" y="56">Browser or app</text><text class="s" x="36" y="76">public internet</text>
  <rect class="box" x="20" y="150" width="170" height="64" rx="8"/><text class="h" x="36" y="176">My devices</text><text class="s" x="36" y="196">phone, laptop (tailnet)</text>

  <rect class="box" x="250" y="30" width="190" height="64" rx="8"/><text class="h" x="266" y="56">Cloudflare</text><text class="s" x="266" y="76">Access (login) + Tunnel</text>
  <rect class="box" x="250" y="150" width="190" height="64" rx="8"/><text class="h" x="266" y="176">Tailscale</text><text class="s" x="266" y="196">private network, no public IP</text>

  <rect class="acc" x="500" y="20" width="340" height="260" rx="10"/>
  <text class="h" x="516" y="46">Host: one laptop, Docker Compose</text>
  <rect class="box" x="516" y="60" width="150" height="50" rx="6"/><text class="t" x="528" y="90">~48 app containers</text>
  <rect class="box" x="680" y="60" width="144" height="50" rx="6"/><text class="t" x="692" y="82">loopback ports</text><text class="s" x="692" y="98">no open router ports</text>
  <rect class="box" x="516" y="122" width="150" height="50" rx="6"/><text class="t" x="528" y="152">read-only Docker proxy</text>
  <rect class="box" x="680" y="122" width="144" height="50" rx="6"/><text class="t" x="692" y="152">guarded reboots</text>
  <rect class="box" x="516" y="184" width="308" height="80" rx="6"/><text class="t" x="528" y="208">Logs: Vector into VictoriaLogs (30 days)</text><text class="t" x="528" y="230">Metrics: Beszel, uptime monitors</text><text class="s" x="528" y="252">disk, temperature and backup watchers</text>

  <rect class="box" x="500" y="310" width="110" height="60" rx="8"/><text class="h" x="512" y="336">Disk repo</text><text class="s" x="512" y="356">restic, nightly</text>
  <rect class="box" x="626" y="310" width="110" height="60" rx="8"/><text class="h" x="638" y="336">USB SSD repo</text><text class="s" x="638" y="356">restic, nightly</text>
  <rect class="box" x="752" y="310" width="88" height="60" rx="8"/><text class="h" x="764" y="336">Off-site</text><text class="s" x="764" y="356">encrypted</text>

  <rect class="box" x="250" y="310" width="190" height="64" rx="8"/><text class="h" x="266" y="336">ntfy push</text><text class="s" x="266" y="356">alerts to my phone</text>
  <rect class="box" x="20" y="310" width="170" height="64" rx="8"/><text class="h" x="36" y="336">Phone</text><text class="s" x="36" y="356">works when host is down</text>

  <path class="ln" d="M190 62H250"/><path class="ac" d="M440 62H500"/>
  <path class="ln" d="M190 182H250"/><path class="ac" d="M440 182H500"/>
  <path class="ln" d="M560 280V310"/><path class="ln" d="M680 280V310"/><path class="ln" d="M790 280V310"/>
  <path class="ln" d="M500 280L440 330"/><path class="ln" d="M250 342H190"/>
  <text class="s" x="20" y="410">Public traffic is outbound-only through the tunnel; everything else stays on the tailnet.</text>
  <text class="s" x="20" y="428">Watchers alert if any backup repository has no snapshot in 30 hours.</text>
</svg>
